# Dependabot's minor and patch updates, every ecosystem, merge themselves once
# the checks .github/rulesets/master.json requires are green on them. A major
# stays open for review: it is the one that can change the API this library
# is built on. The same shape as wader/postfix-relay's workflow of the same
# name, which every repository of this maintainer is aligned on.
#
# "gh pr merge --auto" asks GitHub to merge LATER, once the required checks
# pass, and it is GitHub that does the waiting. Two repository settings make
# that true, and neither is a file:
# - "Allow auto-merge" (Settings > General);
# - a ruleset on master that requires checks. .github/rulesets/master.json is
#   that ruleset, in the form "Import a ruleset" (Settings > Rules) takes, so
#   that the gate is something the tree states and
#   .github/scripts/check_required_checks.py can check, rather than a setting
#   believed. Without it, --auto has nothing to wait for and merges at once.
#
# There is deliberately no fallback to a direct "gh pr merge". It would run
# exactly when --auto cannot be enabled -- which is when nothing requires any
# check -- and land the update with no check having run. A pull request that
# cannot be queued stays open, which is visible, instead of merged, which is
# not.
#
# Every ecosystem, not only github-actions: what decides whether an update is
# safe is CI, which every one of these pull requests runs, and not a guess
# about which ecosystem is risky.
#
# Required checks are matched by job name, never by workflow name. The names
# that exist are "PHPUnit", "PHP_CodeSniffer" and "Required checks", all three
# from ci.yml and all three required, since each reports a verdict on every
# pull request. This job reports too, as "auto-merge", and is not required: on
# every pull request not opened by Dependabot it is skipped, and a skipped job
# counts as a passing one.
#
# The merge is a merge commit, as every pull request on master has been.
#
# It is made in GITHUB_TOKEN's name, and a push made with that token starts no
# workflow, so ci.yml's run on master does not follow a Dependabot merge. The
# tree was tested on the pull request itself; nothing is published from master,
# so all that is lost is a status on the merge commit.

name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Backstop. Two API calls, and nothing here should ever sit for github's
    # default six hours.
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
