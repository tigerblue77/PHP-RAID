# Automatic dependency update pull requests
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Minor and patch updates merge themselves once the checks
# .github/rulesets/master.json requires are green on them
# (.github/workflows/dependabot-auto-merge.yml); a major, or anything red,
# waits for review. One entry per ecosystem the repository has, and each
# entry groups the same way for the same reason.

version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # Opening a pull request is the only way Dependabot reports anything, and
    # it stops opening them once this many are waiting -- silently, naming
    # nothing. The default is 5. Majors come one pull request each and sit
    # until reviewed, so that queue fills. 99 and not 0: zero does not mean
    # "no limit", it disables version updates and leaves only security ones.
    # A large value is how the documentation says to lift the limit.
    open-pull-requests-limit: 99
    groups:
      # One pull request for the minor and patch bumps, so the noise stays
      # low; it merges itself once CI is green. A major is left out of the
      # group and gets its own, because it can change the API this library is
      # built on, and it waits for review.
      composer-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The actions .github/workflows/ use, pinned at their major tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The limit counts per entry, so the reason given on the entry above holds
    # here too.
    open-pull-requests-limit: 99
    groups:
      # Grouped the same way and for the same reason as the entry above.
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
