# Automatic dependency update pull requests
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# No auto-merge here: the only CI in this repository is .travis.yml, and
# Travis no longer builds open source repositories, so nothing reports a
# check on a pull request and there would be nothing to gate a merge on.
# Every pull request below waits for review.

version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for the minor and patch bumps, so the noise stays
      # low. A major is left out of the group and gets its own, because it
      # can change the API this library is built on.
      composer-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
